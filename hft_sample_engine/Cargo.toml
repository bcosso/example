[package]
name = "hft_sample_engine"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-rt = "1.1.0"
actix-web = "3.0.0-alpha.1"
serde = "1.0.106"
serde_json = "1.0.51"
serde_with = "3.16.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "0.8", features = ["serde", "v4"] }
env_logger = "0.7.1"
tokio = "1.0.3"
rand = "0.9.2"
rsocket_rust = "0.7"
rsocket_rust_transport_tcp = "0.7.4"
ordered-float = {version="4", features = ["serde"]}
