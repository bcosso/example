[package]
name = "hft_sample_engine"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-rt = "2"
actix-web = "4"
serde = { version = "1", features = ["derive"]}
serde_json = "1.0.51"
serde_with = "3.16.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "0.8", features = ["serde", "v4"] }
env_logger = "0.7.1"
http = "1.4.0"
hnsw_rs = { path = "../hnswlib-rs"} #"0.3.3"
tokio = "1"
rand = "0.9.2"
reqwest = "0.13.2"
rsocket_rust = "0.7"
rsocket_rust_transport_tcp = "0.7.4"
ordered-float = {version="4", features = ["serde"]}
once_cell = "1.21.3"
thiserror = "2.0.18"
