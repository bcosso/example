[package]
name = "rsocket_server"
version = "0.1.0"
edition = "2024"


[dependencies]
# Tokio for async runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# RSocket implementation and TCP transport
rsocket_rust = "0.7"
rsocket_rust_transport_tcp = "0.7"

# Logging (optional but handy)
env_logger = "0.11"
log = "0.4"

# For generating streams
futures = "0.3"

bytes = "1.7"
